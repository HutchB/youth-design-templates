name: catalog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 条目目录是事实源，清单是生成物：这里只校验两者同步，不在 CI 里回写。
      - run: node scripts/build-catalog.mjs --check
